<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<title>MediaTek System Recovery Mode</title>
	<link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
	<div id="banner">
		MediaTek U-Boot System Recovery Mode
	</div>
	<div id="main">
		<p>Upload new firmware:</p>
		<form action="/upload" method="post" enctype="multipart/form-data">
			<p><input type="file" name="firmware" /></p>
			<p><input type="submit" id="submit" value="Upload Firmware" /></p>
		</form>

		<hr>

		<p>Upload bootloader:</p>
		<form action="/upload_bl" method="post" enctype="multipart/form-data">
			<p><input type="file" name="firmware" /></p>
			<p><input type="submit" id="submit" value="Upload Bootloader" /></p>
		</form>

		<hr>

		<p>Upload factory data:</p>
		<form action="/upload_factory" method="post" enctype="multipart/form-data">
			<p><input type="file" name="firmware" /></p>
			<p><input type="submit" id="submit" value="Upload Factory" /></p>
		</form>

		<hr>

		<p>Erase partition (NVRAM / Factory / Factory2):</p>
		<p><a href="/erase_select.html" style="color:#c00; font-weight:bold;"
			onclick="return confirm('WARNING: Erasing partitions will destroy data permanently.\nFactory partition contains MAC &amp; RF calibration data!\n\nContinue?');">
			&#9888; Go to Erase Partition Menu
		</a></p>
		<p style="font-size:11px; color:#888;">
			Available actions: erase NVRAM (0xe0000), Factory (0x1e0000), Factory2 (0x2e0000), or all three.
		</p>

		<hr>

		<p style="font-size: 12px; color: #666;">作者：黑猫  QQ群号：160318975</p>
	</div>
</body>
</html>
